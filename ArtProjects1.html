    <style>
        h1 {
            color:#DECCEA;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            width: 90%;
            margin: 40px auto;

            text-align: center;
            background: #DECCEA;
        }

        .item img{
            width: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        @media (max-width: 600px){
            nav a{
                display: inline-block;
                margin: 15px 0;
            }
            .item{
                grid-template-columns: repeat(1, 1fr);
            }
            .gallery{
                grid-template-columns: repeat(2, 1fr);
            }
        }

    </Style>

</head>
