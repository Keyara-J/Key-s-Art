<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color:#DECCEA;
            font-size: 5em;
            text-align: center;
            font-style: Monospace;      
        }
        h3 {
            color:#DECCEA;
            font-size: 20px;
            text-align: center;
            font-style: Monospace;      
        }
        .top-nav {
            position:sticky;
            top: 0;
            right: 0;
            left: 0;
            z-index: 1000;
            background-color: #9862BF;
            padding: 15px 0;
            border-bottom: 3px solid #4C0075;
        }
        .top-nav a {
            margin: 15px;
            text-decoration: underline;
            font-size: 30px;   
        }
        .top-nav a.active {
            color: #DECCEA !important;
            font-weight: bold;
            text-decoration: underline;
            padding-bottom: 5px;
        }
        .section{
            text-align: center;
            padding: 30px 0;         /* space inside */
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            font-size: 20px;

        }
        .gallery-photo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);   /* 3 photos side by side */
            gap: 25px;
            width: 90%;
            margin: 40px auto;
        }

        .gallery-photo .item {
            background: #DECCEA;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #4C0075;
        }

        .gallery-photo img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
        }
        .gallery-photo img:hover {opacity: 0.7;}

        /* background */
        .modal {
            display: none; /*hidden*/
            position: fixed;
            z-index: 99;
            padding-top: 100px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.85);
            
        }

        /*zoomed image*/
        .modal-content {
            margin: auto;
            display: block;
            width: 75%; 
            max-width: 900px;
            animation: zoom 0.4s;
        }

        .close {
            position: absolute;
            top: 40px;
            right: 60px;
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        @keyframes zoom {
            from {transform:scale(0.4)}
            to {transform:scale(1)}
        }
        

        /* 100% Image Width on Smaller Screens */
        @media only screen and (max-width: 700px){
            .modal-content {
            width: 100%;
        }
        
}

        
    </style>
</head>


<body style="background-color: #9862BF;">
    <div id="myModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="imgZoom">
</div>
<script>
    // Get modal
    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("imgZoom");
    var closeBtn = document.getElementsByClassName("close")[0];

    // Add click event to all gallery images
    document.querySelectorAll(".gallery-photo img").forEach(img => {
        img.onclick = function() {
            modal.style.display = "block";
            modalImg.src = this.src;
        }
    });

    // Close modal when clicking X
    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    // Close modal when clicking outside the image
    modal.onclick = function(e) {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    }
</script>
